# Arena Forge Android APK (sideload, like Box)
#
# Builds a DEBUG APK of the Capacitor shell (which bundles the real game.js
# via dist/) on every push to main and on manual dispatch, and uploads it as
# the `arena-forge-apk` artifact for Anthony to sideload. Debug signing uses
# the FIXED keystore committed at android/debug.keystore (standard debug
# credentials), so every build is signed with the same key and installs over
# the previous one. One-time uninstall is still needed this once: the APK
# currently on his phone was signed with a random per-run key. No Play Store,
# no release signing.
name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc + vite build; postbuild bundles the full web runtime
      # (game.js, bootstrap.js, CSS, modules, audio) into dist/ for
      # Capacitor's local web server (scripts/copy-gamejs-to-dist.mjs).
      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do NOT use android-actions/setup-android@v3 — it runs
      # `sdkmanager tools` and the obsolete "tools" package no longer
      # exists, so the step fails (first main run after PR #133,
      # 2026-11-18: "Failed to find package 'tools'", sdkmanager exit 1).
      # Use the runner's preinstalled SDK + explicit sdkmanager calls
      # instead — Box's proven pattern. compileSdk/targetSdk are 34
      # (android/variables.gradle), AGP 8.2.1 defaults to build-tools 34.0.0.
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arena-forge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

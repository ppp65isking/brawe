# Arena Forge Android APK (sideload, like Box)
#
# Builds a DEBUG APK of the Capacitor shell (which bundles the real game.js
# via dist/) on every push to main and on manual dispatch, and uploads it as
# the `arena-forge-apk` artifact for Anthony to sideload. Debug signing only:
# the signing key changes per CI run, so uninstall any previous Arena Forge
# APK before installing a new one. No Play Store, no release signing.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc + vite build; postbuild copies game.js into dist/ for the
      # Capacitor file:// runtime (scripts/copy-gamejs-to-dist.mjs).
      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arena-forge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
